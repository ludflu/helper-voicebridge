[project]
name = "whisper-grpc"
version = "0.1.0"
description = "gRPC streaming speech-to-text using insanely-fast-whisper (Transformers + Flash Attention)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "httpx>=0.27",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.39",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.3",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
whisper-grpc-server = "whisper_grpc.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_grpc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]
