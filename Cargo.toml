[package]
name = "qc-voice-bridge"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
futures-util = "0.3"
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
async-stream = "0.3"

[build-dependencies]
tonic-build = "0.12"
