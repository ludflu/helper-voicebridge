[package]
name = "qc-voice-bridge"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
futures-util = "0.3"
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
async-stream = "0.3"

[build-dependencies]
tonic-build = "0.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Complexity / size (see clippy.toml for thresholds)
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "allow"
too_many_arguments = "warn"
type_complexity = "warn"
# Hygiene
collapsible_if = "warn"
items_after_test_module = "warn"
module_inception = "warn"
